<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1117" />

    <!-- SEO -->
    <title>PortTrip — AI Cruise Port Planner | Never Miss the Ship</title>
    <meta name="description" content="PortTrip is the #1 AI-powered cruise port planner. Build personalised itineraries, track your budget, get safety return timers, and access everything offline at sea. Save €80+ per port day." />
    <meta name="keywords" content="cruise port planner, cruise excursion alternative, DIY cruise tour, port day itinerary, cruise budget tracker, offline cruise app" />
    <link rel="canonical" href="https://porttrip.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PortTrip — AI Cruise Port Planner" />
    <meta property="og:description" content="Build AI-powered port day itineraries. Save €80+ vs ship excursions. Works offline at sea. Safety timers included." />
    <meta property="og:url" content="https://porttrip.app/" />
    <meta property="og:site_name" content="PortTrip" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PortTrip — AI Cruise Port Planner" />
    <meta name="twitter:description" content="Build AI-powered port day itineraries. Save €80+ vs ship excursions. Works offline at sea." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PortTrip",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Any",
      "description": "AI-powered cruise port day planner with safety timers, budget tracking, offline access, and group sharing.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
